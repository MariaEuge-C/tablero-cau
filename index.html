<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAU Fundación — Performance</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500;700&display=swap');
:root{
  --g900:#03291F;--g800:#04342C;--g700:#085041;--g600:#0F6E56;--g500:#1D9E75;
  --g400:#3DBFA0;--g300:#5DCAA5;--g200:#9FE1CB;--g100:#D4F5EA;--g50:#EAF9F3;
  --amber:#BA7517;--amber-l:#FAEEDA;--red:#C0392B;--red-l:#FDECEA;
  --text:#0D1F1A;--text2:#3D5A52;--text3:#7A9E95;
  --bg:#F4FAF7;--card:#FFFFFF;--border:#C8E8DC;--r:12px;--r-sm:8px;
  --shadow:0 1px 4px rgba(8,80,65,.08),0 4px 16px rgba(8,80,65,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:1200px;margin:0 auto;padding:1.25rem 1rem 3rem}
.hdr{background:linear-gradient(135deg,var(--g900) 0%,var(--g800) 50%,var(--g700) 100%);border-radius:var(--r);padding:20px 24px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 4px 24px rgba(4,52,44,.3)}
.hdr-title{font-size:20px;font-weight:700;color:var(--g50);display:flex;align-items:center;gap:10px}
.hdr-sub{font-size:12px;color:var(--g300);margin-top:4px;font-weight:500;letter-spacing:.02em}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fecha-pill{font-size:12px;color:var(--g200);background:var(--g900);padding:6px 14px;border-radius:20px;font-weight:600;border:1px solid var(--g600);font-family:'DM Mono',monospace}
.role-btn{font-size:12px;padding:6px 14px;border-radius:20px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:700;background:var(--g700);color:var(--g200);transition:all .2s}
.role-btn:hover{background:var(--g500);color:white}
.role-admin{background:var(--g500);color:white}
.loading{text-align:center;padding:48px;color:var(--g600)}
.spin{font-size:32px;animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.top-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.sub-nav{display:flex;gap:8px;flex-wrap:wrap}
.snb{padding:8px 18px;border-radius:var(--r-sm);font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid var(--g200);font-family:'DM Sans',sans-serif;background:white;color:var(--g700);transition:all .15s}
.snb:hover:not(.snb-on){background:var(--g50);border-color:var(--g400)}
.snb-on{background:var(--g700);color:white;border-color:var(--g700)}
.btn-dl{padding:8px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;background:var(--g500);color:white;display:flex;align-items:center;gap:6px;transition:all .15s}
.btn-dl:hover{background:var(--g600)}
.filter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding:10px 14px;border-radius:var(--r-sm);background:var(--g50);border:1px solid var(--g200)}
.flabel{font-size:12px;color:var(--g700);font-weight:700}
.fb{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:white;color:var(--g700);font-family:'DM Sans',sans-serif;transition:all .15s}
.fb:hover:not(.fb-on){border-color:var(--g400);background:var(--g50)}
.fb-on{background:var(--g700);color:white;border-color:var(--g700)}
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{border-radius:var(--r);padding:16px 14px;text-align:center;box-shadow:var(--shadow)}
.kpi-dk{background:var(--g800)}.kpi-md{background:var(--g700)}.kpi-lt{background:var(--g500)}
.kpi-pale{background:white;border:1px solid var(--g200)}.kpi-mint{background:var(--g100);border:1px solid var(--g300)}
.kpi-dk .kl,.kpi-md .kl,.kpi-lt .kl{font-size:11px;font-weight:700;color:var(--g300);margin-bottom:6px;line-height:1.3;text-transform:uppercase;letter-spacing:.05em}
.kpi-pale .kl,.kpi-mint .kl{font-size:11px;font-weight:700;color:var(--g700);margin-bottom:6px;line-height:1.3;text-transform:uppercase;letter-spacing:.05em}
.kpi-dk .kv,.kpi-md .kv,.kpi-lt .kv{font-size:34px;font-weight:700;color:white;line-height:1;font-family:'DM Mono',monospace}
.kpi-pale .kv,.kpi-mint .kv{font-size:34px;font-weight:700;color:var(--g800);line-height:1;font-family:'DM Mono',monospace}
.kpi .ks{font-size:11px;margin-top:5px;font-weight:600}
.kpi-dk .ks,.kpi-md .ks,.kpi-lt .ks{color:var(--g300)}
.kpi-pale .ks,.kpi-mint .ks{color:var(--g600)}
.clist{display:flex;flex-direction:column;gap:10px}
.cc{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.cc:hover{border-color:var(--g400);box-shadow:0 2px 12px rgba(8,80,65,.12)}
.ch{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;gap:8px;transition:background .12s}
.ch:hover{background:var(--g50)}
.cname{display:flex;flex-direction:column;gap:3px}
.ccode{font-size:12px;font-weight:700;color:var(--g500);letter-spacing:.08em;font-family:'DM Mono',monospace}
.cfull{font-size:16px;font-weight:700;color:var(--text)}
.cbadges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px}
.b-ok{background:var(--g100);color:var(--g800)}.b-no{background:var(--red-l);color:var(--red)}
.b-warn{background:var(--amber-l);color:var(--amber)}.b-neu{background:#F0F4F2;color:var(--text2)}
.chev{font-size:18px;color:var(--g500);transition:transform .2s;flex-shrink:0}
.cbody{border-top:1px solid var(--g100);padding:18px 20px;display:none;background:#FAFCFB}
.cbody.open{display:block}
.sec-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;padding-bottom:6px;color:var(--g700);border-bottom:2px solid var(--g300);display:flex;align-items:center;gap:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.fr{display:flex;flex-direction:column;gap:3px;background:white;border-radius:var(--r-sm);padding:10px 12px;border:1px solid var(--border)}
.fr label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.fv{font-size:20px;font-weight:700;color:var(--text);font-family:'DM Mono',monospace}
.fv-calc{color:var(--g600)}
.prog-wrap{margin:10px 0 4px}
.prog-label{display:flex;justify-content:space-between;font-size:12px;color:var(--g700);margin-bottom:5px;font-weight:700}
.pbg{height:10px;background:var(--g100);border-radius:5px;overflow:hidden}
.pf{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.pf-v{background:linear-gradient(90deg,var(--g500),var(--g400))}
.pf-n{background:linear-gradient(90deg,#BA7517,#FAC775)}
.pf-r{background:linear-gradient(90deg,#C0392B,#E57368)}
.total-box{background:linear-gradient(135deg,var(--g800),var(--g700));border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.total-box .tl{font-size:12px;font-weight:700;color:var(--g300);text-transform:uppercase;letter-spacing:.05em}
.tv-wrap{display:flex;align-items:center;gap:12px}
.tv{font-size:28px;font-weight:700;color:white;font-family:'DM Mono',monospace}
.total-adj{display:flex;align-items:center;gap:6px}
.total-adj label{font-size:11px;color:var(--g300);font-weight:600}
.total-inp{padding:5px 8px;border-radius:var(--r-sm);border:1px solid var(--g600);background:var(--g900);color:white;font-size:14px;font-weight:700;font-family:'DM Mono',monospace;width:80px;text-align:center}
.total-inp:focus{outline:none;border-color:var(--g400)}
.btn-reset{font-size:11px;color:var(--g300);background:none;border:1px solid var(--g600);border-radius:20px;cursor:pointer;font-family:'DM Sans',sans-serif;padding:3px 10px;font-weight:600}
.btn-reset:hover{background:var(--g700)}
.divh{height:1px;background:var(--g100);margin:16px 0}
.lock-box{background:white;border:1px solid var(--g200);border-radius:var(--r);padding:36px 24px;text-align:center;margin-top:4px;box-shadow:var(--shadow)}
.lock-icon{font-size:40px;color:var(--g700);margin-bottom:14px}
.lock-box h3{font-size:18px;font-weight:700;color:var(--g800);margin-bottom:8px}
.lock-box p{font-size:14px;color:var(--text2);margin-bottom:20px}
.lock-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.lpwd{padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--g200);background:white;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;width:200px;text-align:center}
.lpwd:focus{outline:none;border-color:var(--g500)}
.bunlock{padding:10px 22px;background:var(--g700);color:white;border:none;border-radius:var(--r-sm);font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:700}
.bunlock:hover{background:var(--g600)}
.lock-err{font-size:13px;color:var(--red);margin-top:10px;display:none;font-weight:700}
.bcancel{font-size:13px;color:var(--text2);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:12px;text-decoration:underline}
.toast{position:fixed;bottom:24px;right:24px;background:var(--g700);color:white;padding:12px 20px;border-radius:var(--r-sm);font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:999}
.toast.show{opacity:1}
.info-banner{background:var(--amber-l);border:1px solid #FAC775;border-radius:var(--r-sm);padding:10px 14px;font-size:12px;color:#854F0B;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.bsave{padding:9px 22px;background:var(--g700);color:white;border:none;border-radius:var(--r-sm);font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:14px;font-weight:700}
.bsave:hover{background:var(--g600)}

/* RANKING */
.ranking-wrap{background:white;border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;margin-top:16px}
.ranking-head{background:linear-gradient(135deg,var(--g800),var(--g700));padding:14px 20px;display:flex;align-items:center;gap:10px}
.ranking-head span{font-size:14px;font-weight:700;color:var(--g200);text-transform:uppercase;letter-spacing:.05em}
.ranking-item{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--g50);transition:background .1s}
.ranking-item:last-child{border-bottom:none}
.ranking-item:hover{background:var(--g50)}
.rank-pos{font-size:16px;font-weight:700;color:var(--g700);width:28px;text-align:center;font-family:'DM Mono',monospace}
.rank-pos.gold{color:#B8860B}.rank-pos.silver{color:#707070}.rank-pos.bronze{color:#8B4513}
.rank-name{flex:1;font-size:14px;font-weight:600;color:var(--text)}
.rank-val{font-size:18px;font-weight:700;color:var(--g700);font-family:'DM Mono',monospace}
.rank-bar-wrap{width:120px}
.rank-bar{height:6px;background:var(--g100);border-radius:3px;overflow:hidden}
.rank-bar-fill{height:100%;background:linear-gradient(90deg,var(--g500),var(--g400));border-radius:3px}
.rank-empty{padding:24px;text-align:center;color:var(--text3);font-size:13px}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div>
      <div class="hdr-title"><i class="ti ti-school"></i>CAU Fundación — Performance</div>
      <div class="hdr-sub">Seguimiento de Indicadores de Gestión · 8 Centros de Apoyo Universitario</div>
    </div>
    <div class="hdr-right">
      <div class="fecha-pill" id="fecha"></div>
      <button class="role-btn" id="role-btn" onclick="toggleRole()">
        <i class="ti ti-lock" style="font-size:13px;margin-right:4px"></i><span id="role-lbl">Visitante</span>
      </button>
    </div>
  </div>
  <div class="top-actions">
    <div class="sub-nav" id="sub-nav"></div>
    <button class="btn-dl" onclick="descargarExcel()">
      <i class="ti ti-file-spreadsheet" style="font-size:15px"></i>Descargar Excel
    </button>
  </div>
  <div id="main-content">
    <div class="loading"><div class="spin"><i class="ti ti-refresh"></i></div>
    <p style="margin-top:12px;font-weight:600;color:var(--g700)">Cargando datos...</p></div>
  </div>
  <div class="toast" id="toast"></div>
  <div id="lock-panel" style="display:none">
    <div class="lock-box">
      <div class="lock-icon"><i class="ti ti-lock"></i></div>
      <h3>Acceso de administrador</h3>
      <p>Ingresá la contraseña para acceder al modo edición</p>
      <div class="lock-row">
        <input class="lpwd" type="password" id="pwd-inp" placeholder="Contraseña" onkeydown="if(event.key==='Enter')tryUnlock()">
        <button class="bunlock" onclick="tryUnlock()"><i class="ti ti-lock-open" style="font-size:14px;margin-right:5px"></i>Ingresar</button>
      </div>
      <div class="lock-err" id="pwd-err">Contraseña incorrecta</div>
      <div><button class="bcancel" onclick="closeLock()">Cancelar</button></div>
    </div>
  </div>
</div>

<script>
var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSf0mk3M-KhA7XG5Vyc9YCmHKDLoV2vgTUhh5Yt-NiyNw7qxrp9cocN8TciP2TeuGgKHDkUyrqG7hil/pub?gid=0&single=true&output=csv';
var CSV_RANKING_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSf0mk3M-KhA7XG5Vyc9YCmHKDLoV2vgTUhh5Yt-NiyNw7qxrp9cocN8TciP2TeuGgKHDkUyrqG7hil/pub?gid=1&single=true&output=csv';
var PWD = 'Cau2026-';

var CAUS_BASE = [
  {code:'BLN01',nombre:'Balnearia'},{code:'BZR01',nombre:'Burzaco'},
  {code:'CEJ01',nombre:'Cruz del Eje'},{code:'DFU01',nombre:'Dean Funes'},
  {code:'FRA03',nombre:'San Francisco'},{code:'JMA01',nombre:'Jesus Maria'},
  {code:'MOR03',nombre:'Morteros'},{code:'SLU02',nombre:'Villa Mercedes'}
];

function emptyCAU(code, nombre) {
  return {
    code:code, nombre:nombre,
    rn_aranc_ant:0,rn_aranc_gen:0,rn_ri:0,rn_fin:0,
    rn_pases_env:0,rn_pases_rec:0,rn_rec:0,rn_pers:0,
    r1c_ins_ant:0,r1c_aranc_gen:0,r1c_ri:0,
    r1c_pases_env:0,r1c_pases_rec:0,r1c_pers:0,
    ni_mat_ant:0,ni_mat_fact:0,ni_aranc_ant:0,ni_aranc_fact:0,
    ni_obj:0,ni_pers:0,
    ni_call:0,ni_conv_lead:0,ni_obj_lead:0,ni_cumpl_lead:0,
    alumnos_ed:0, alumnos_edh:0, comision_pers:0,
    sa_cma:0, sa_aprobado:0, sa_regular:0, sa_lib_nota:0, sa_libre:0, sa_cursando:0,
    total_manual:null
  };
}

var DATA = CAUS_BASE.map(function(c){ return emptyCAU(c.code, c.nombre); });
var RANKING = [];
var isAdmin = false;
var nav = 'general';
var filtro = 'global';
var csvLoaded = false;

function parseNum(v) {
  if (!v) return 0;
  return parseFloat(String(v).replace(',','.')) || 0;
}

function parseCSV(text) {
  var lines = text.split('\n').filter(function(l){ return l.trim(); });
  if (lines.length < 2) return [];
  var sep = (lines[0].indexOf('\t') > -1) ? '\t' : ',';
  var headers = lines[0].split(sep).map(function(h){
    return h.trim().replace(/\r/g,'').replace(/"/g,'');
  });
  var result = [];
  for (var i = 1; i < lines.length; i++) {
    var vals = lines[i].split(sep).map(function(v){
      return v.trim().replace(/\r/g,'').replace(/"/g,'');
    });
    var obj = {};
    for (var j = 0; j < headers.length; j++) {
      if (headers[j]) obj[headers[j]] = vals[j] || '';
    }
    if (obj.code && obj.code.trim()) result.push(obj);
  }
  return result;
}

function parseRankingCSV(text) {
  var lines = text.split('\n').filter(function(l){ return l.trim(); });
  if (lines.length < 2) return [];
  var sep = (lines[0].indexOf('\t') > -1) ? '\t' : ',';
  // detectar índice de columnas (case-insensitive)
  var hdrs = lines[0].split(sep).map(function(h){ return h.trim().toLowerCase().replace(/\r/g,''); });
  var idxNombre = hdrs.indexOf('nombre'); if(idxNombre<0) idxNombre=0;
  var idxNi = hdrs.indexOf('ni'); if(idxNi<0) idxNi=1;
  var result = [];
  for (var i = 1; i < lines.length; i++) {
    var vals = lines[i].split(sep).map(function(v){ return v.trim().replace(/\r/g,'').replace(/"/g,''); });
    if (vals[0]) var vnom=(vals[idxNombre]||'').trim().replace(/\r/g,''); var vni=parseNum((vals[idxNi]||'0').replace(/\r/g,'')); if(vnom) result.push({ nombre: vnom, ni: vni });
  }
  result.sort(function(a,b){ return b.ni - a.ni; });
  return result;
}

function loadCSV() {
  fetch(CSV_URL)
    .then(function(r){ if(!r.ok) throw new Error('fail'); return r.text(); })
    .then(function(text) {
      var rows = parseCSV(text);
      rows.forEach(function(row) {
        var rawCode = (row.code || '').trim();
        if (!rawCode) return;
        var normCode = (rawCode === 'BRZ01') ? 'BZR01' : rawCode;
        var idx = -1;
        for (var i = 0; i < DATA.length; i++) { if (DATA[i].code === normCode) { idx = i; break; } }
        var nombre = (row.nombre || '').trim();
        if (!nombre && idx >= 0) nombre = DATA[idx].nombre;
        var entry = {
          code:normCode, nombre:nombre||normCode,
          rn_aranc_ant:parseNum(row.rn_aranc_ant), rn_aranc_gen:parseNum(row.rn_aranc_gen),
          rn_ri:parseNum(row.rn_ri), rn_fin:parseNum(row.rn_fin),
          rn_pases_env:parseNum(row.rn_pases_env), rn_pases_rec:parseNum(row.rn_pases_rec),
          rn_rec:parseNum(row.rn_rec), rn_pers:parseNum(row.rn_pers),
          r1c_ins_ant:parseNum(row.r1c_ins_ant), r1c_aranc_gen:parseNum(row.r1c_aranc_gen),
          r1c_ri:parseNum(row.r1c_ri),
          r1c_pases_env:parseNum(row.r1c_pases_env), r1c_pases_rec:parseNum(row.r1c_pases_rec),
          r1c_pers:parseNum(row.r1c_pers),
          ni_mat_ant:parseNum(row.ni_mat_ant), ni_mat_fact:parseNum(row.ni_mat_fact),
          ni_aranc_ant:parseNum(row.ni_aranc_ant), ni_aranc_fact:parseNum(row.ni_aranc_fact),
          ni_obj:parseNum(row.ni_obj), ni_pers:parseNum(row.ni_pers),
          ni_call:parseNum(row.ni_call),
          ni_conv_lead:parseNum(row.ni_conv_lead),
          ni_obj_lead:parseNum(row.ni_obj_lead),
          ni_cumpl_lead:parseNum(row.ni_cumpl_lead),
          sa_tp1_pct:parseNum(row.sa_tp1_pct), sa_tp1_cant:parseNum(row.sa_tp1_cant), sa_tp1_alerta:row.sa_tp1_alerta||'', sa_tp1_obj:parseNum(row.sa_tp1_obj), sa_tp1_cumpl:parseNum(row.sa_tp1_cumpl), sa_tp1_falt:parseNum(row.sa_tp1_falt),
          sa_tp2_pct:parseNum(row.sa_tp2_pct), sa_tp2_cant:parseNum(row.sa_tp2_cant), sa_tp2_alerta:row.sa_tp2_alerta||'', sa_tp2_obj:parseNum(row.sa_tp2_obj), sa_tp2_cumpl:parseNum(row.sa_tp2_cumpl), sa_tp2_falt:parseNum(row.sa_tp2_falt),
          sa_tp3_pct:parseNum(row.sa_tp3_pct), sa_tp3_cant:parseNum(row.sa_tp3_cant), sa_tp3_alerta:row.sa_tp3_alerta||'', sa_tp3_obj:parseNum(row.sa_tp3_obj), sa_tp3_cumpl:parseNum(row.sa_tp3_cumpl), sa_tp3_falt:parseNum(row.sa_tp3_falt),

function pct(a,b){ return b ? Math.round(a/b*1000)/10 : 0; }
function pclr(v){ return v>=100?'pf-v':v>=80?'pf-n':'pf-r'; }

function setFecha(){
  var d=new Date();
  var dias=['Dom','Lun','Mar','Mie','Jue','Vie','Sab'];
  var meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  document.getElementById('fecha').textContent=dias[d.getDay()]+' '+d.getDate()+' de '+meses[d.getMonth()]+' '+d.getFullYear();
}
function showToast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2400); }

function renderNav(){
  var tabs=[
    ['general','<i class="ti ti-chart-bar" style="margin-right:5px"></i>Indicadores Generales'],
    ['ni','<i class="ti ti-user-plus" style="margin-right:5px"></i>Nuevos Ingresantes'],
    ['pers','<i class="ti ti-repeat" style="margin-right:5px"></i>Persistencia']
  ];
  if(isAdmin) tabs.push(['cargar','<i class="ti ti-edit" style="margin-right:5px"></i>Cargar datos']);
  document.getElementById('sub-nav').innerHTML=tabs.map(function(t){
    return '<button class="snb'+(nav===t[0]?' snb-on':'')+'" onclick="setNav(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('');
}

function setNav(n){ nav=n; filtro='global'; renderNav(); renderMain(); }
function setFiltro(f){ filtro=f; renderMain(); }

function renderMain(){
  var el=document.getElementById('main-content');
  if(nav==='cargar'&&isAdmin){ el.innerHTML=renderCargar(); return; }
  var html='';
  if(!csvLoaded) html+='<div class="info-banner"><i class="ti ti-alert-triangle"></i>No se pudo conectar con la planilla.</div>';

  if(nav==='general'){
    html+='<div style="background:var(--g50);border:1.5px dashed var(--g300);border-radius:var(--r);padding:48px 24px;text-align:center;margin-top:8px">'+
      '<i class="ti ti-clock" style="font-size:40px;color:var(--g400)"></i>'+
      '<p style="font-size:20px;font-weight:700;color:var(--g700);margin-top:14px">Próximamente</p>'+
      '<p style="font-size:14px;color:var(--text2);margin-top:8px">Esta sección está en preparación.<br>Pronto encontrarás aquí los nuevos datos de Indicadores Generales.</p>'+
    '</div>';
  } else if(nav==='ni'){
    html+=renderFilterBar();
    if(filtro==='global'){ html+=renderGlobalNI(); html+=renderRanking(); html+=renderRankingNI(); }
    else{ var c=findC(filtro); if(c) html+=renderSingleNI(c)+renderDetalleNI(c,DATA.indexOf(c)); }
  } else if(nav==='pers'){
    html+=renderFilterBar();
    if(filtro==='global'){ html+=renderGlobalPers(); }
    else{
      var c=findC(filtro);
      if(c) html+=renderSinglePers(c)+renderDetallePersConTabs(c,DATA.indexOf(c));
    }
  }
  el.innerHTML=html;
}

function findC(code){ for(var i=0;i<DATA.length;i++) if(DATA[i].code===code) return DATA[i]; return null; }

function renderFilterBar(){
  var h='<div class="filter-row"><span class="flabel"><i class="ti ti-filter" style="font-size:12px;margin-right:3px"></i>Ver:</span>';
  h+='<button class="fb'+(filtro==='global'?' fb-on':'')+'" onclick="setFiltro(\'global\')">Global</button>';

function alertaColor(alerta){

}

function renderSeguimientoAcademico(c,i){

    {label:"TP 3",pk:"sa_tp3_pct",ck2:"sa_tp3_cant",ak:"sa_tp3_alerta",ok:"sa_tp3_obj",ck:"sa_tp3_cumpl",fk:"sa_tp3_falt"},
    {label:"TP 4",pk:"sa_tp4_pct",ck2:"sa_tp4_cant",ak:"sa_tp4_alerta",ok:"sa_tp4_obj",ck:"sa_tp4_cumpl",fk:"sa_tp4_falt"},
    {label:"Parcial 1",pk:"sa_p1_pct",ck2:"sa_p1_cant",ak:"sa_p1_alerta",ok:"sa_p1_obj",ck:"sa_p1_cumpl",fk:"sa_p1_falt"},
    {label:"Parcial 2",pk:"sa_p2_pct",ck2:"sa_p2_cant",ak:"sa_p2_alerta",ok:"sa_p2_obj",ck:"sa_p2_cumpl",fk:"sa_p2_falt"},

function switchPersTab(i,tab){

function descargarExcel(){
  var fecha=new Date(), f=fecha.toLocaleDateString('es-AR');
  var res=[['CAU Fundacion - Performance','Fecha: '+f],[],['RESUMEN GLOBAL'],
    ['Indicador','Valor','Objetivo','% Cumplimiento']];
  var rn_ri=0,rn_obj=0,r1c_ri=0,r1c_obj=0,ni_f=0,ni_o=0,tot=0;
  for(var i=0;i<DATA.length;i++){ rn_ri+=DATA[i].rn_ri; rn_obj+=DATA[i].rn_obj; r1c_ri+=DATA[i].r1c_ri; r1c_obj+=DATA[i].r1c_obj; ni_f+=DATA[i].ni_aranc_fact; ni_o+=DATA[i].ni_obj; tot+=totalFinal(DATA[i]); }
  res.push(['RI Netos total',rn_ri,rn_obj,pct(rn_ri,rn_obj)+'%']);
  res.push(['RI 1a Cohorte total',r1c_ri,r1c_obj,pct(r1c_ri,r1c_obj)+'%']);
  res.push(['NI Arancelados total',ni_f,ni_o,pct(ni_f,ni_o)+'%']);
  res.push(['Total estudiantes',tot,'','']);
  var rih=['Codigo','Centro','Aranc. periodo ant.','RI aranc. gen.','Reinscriptos','Objetivo','% Cumpl.','Fin cursado','Pases env.','Pases rec.','Recuperos','Persistencia neta','RI 1C aranc. gen.','RI 1C Reinscriptos','RI 1C Objetivo','RI 1C % Cumpl.','1C Pases env.','1C Pases rec.','Persistencia 1C'];
  var rir=DATA.map(function(c){ return [c.code,c.nombre,c.rn_aranc_ant,c.rn_aranc_gen,c.rn_ri,c.rn_obj,pct(c.rn_ri,c.rn_obj)+'%',c.rn_fin,c.rn_pases_env,c.rn_pases_rec,c.rn_rec,c.rn_pers+'%',c.r1c_aranc_gen,c.r1c_ri,c.r1c_obj,pct(c.r1c_ri,c.r1c_obj)+'%',c.r1c_pases_env,c.r1c_pases_rec,c.r1c_pers+'%']; });
  var nih=['Codigo','Centro','Matriculados Año Anterior','Matriculados Facturados','Arancelados Año Anterior','Arancelados Facturados','Objetivo Semestral','Cumplimiento Objetivo','NI Call','Conversión Lead','Objetivo Lead','Cumpl. Lead','Total Estudiantes'];
  var nir=DATA.map(function(c){ return [c.code,c.nombre,c.ni_mat_ant,c.ni_mat_fact,c.ni_aranc_ant,c.ni_aranc_fact,c.ni_obj,pct(c.ni_aranc_fact,c.ni_obj)+'%',c.ni_call,c.ni_conv_lead+'%',c.ni_obj_lead,c.ni_cumpl_lead+'%',totalFinal(c)]; });
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(res),'Resumen Global');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([rih].concat(rir)),'Indicadores Generales');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([nih].concat(nir)),'Nuevos Ingresantes');
  XLSX.writeFile(wb,'CAU_Fundacion_Performance_'+fecha.toISOString().slice(0,10)+'.xlsx');
  showToast('Descargado correctamente');
}
